spring:
  application:
    name: payment-reconciliation-lab
  profiles:
    active: ${APP_ENV:default}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:payment_reconciliation_lab}}
    username: ${POSTGRES_USER:payment_reconciliation_lab}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}
  seed:
    enabled: ${DEV_SEED_ENABLED:false}
